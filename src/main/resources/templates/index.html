<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>선박 및 터미널 검색</title>
    <!-- 부트스트랩 CSS (깔끔한 UI용) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center mb-4">터미널 선박 정보 검색</h2>
                
                <!-- 검색 폼 (서버의 /search 경로로 GET 요청 전송) -->
                <form action="/search" method="get" class="card p-4 shadow-sm">
                    <div class="row g-2">
                        <!-- 카테고리 선택 드롭박스 -->
                        <div class="col-md-4">
                            <select name="terminal" class="form-select" required>
                                <option value="" disabled selected>터미널 선택</option>
                                <option value="BNCT">BNCT</option>
                                <option value="DGT">DGT</option>
                                <option value="HJNC">HJNC</option>
                                <option value="HPNT">HPNT</option>
                                <option value="PNC">PNC</option>
                                <option value="PNIT">PNIT</option>
                              
                            </select>
                        </div>
                        
                        <!-- 검색어 입력창 -->
                        <div class="col-md-6">
                            <input type="text" name="keyword" class="form-control" placeholder="검색어(선박명 등)를 입력하세요" required>
                        </div>
                        
                        <!-- 검색 버튼 -->
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">검색</button>
                        </div>
                    </div>
                </form>
				<!-- 검색 결과 목록 영역 -->
				<div class="mt-4" th:if="${results != null}">
				    <h4>검색 결과</h4>
				    <div class="table-responsive">
				        <table class="table table-bordered table-striped mt-2">
				            <thead class="table-dark">
				                <tr>
				                    <th>터미널</th>
				                    <th>선명</th>
				                    <th>TR 정보</th>
				                    <th>ETA (입항시각)</th>
				                    <th>ETD (출항시각)</th>
				                </tr>
				            </thead>
				            <tbody>
				                <tr th:each="info : ${results}">
				                    <td th:text="${info.terminal}">BNCT</td>
				                    <td th:text="${info.shipName}">-</td>
				                    <td th:text="${info.trCode}" class="fw-bold text-primary">-</td>
				                    <td th:text="${info.eta}">-</td>
				                    <td th:text="${info.etd}">-</td>
				                </tr>
				                <tr th:if="${#lists.isEmpty(results)}">
				                    <td colspan="5" class="text-center text-muted">검색 결과가 없습니다.</td>
				                </tr>
				            </tbody>
				        </table>
				    </div>
				</div>

            </div>
        </div>
    </div>
</body>
</html>
