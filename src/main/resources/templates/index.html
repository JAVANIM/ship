<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선박 및 터미널 검색</title>
    <!-- 부트스트랩 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media (max-width: 768px) {
            body {
                font-size: 16px;
            }
            .form-control, .form-select, .btn {
                font-size: 1.1rem !important;
                padding: 0.75rem 1rem !important;
            }
            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="https://rlatlqktp12345-ctrl.github.io/kaejamom/?v=1">↩️돌아가기</a>
    
  </div>
</nav>
    <div class="container my-4 px-3">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <h2 class="text-center mb-4 fw-bold">터미널 입출항 정보 검색</h2>
                
                <!-- 검색 폼 -->
                <form action="/search" method="get" class="card p-3 p-md-4 shadow-sm border-0 rounded-4">
                    <div class="row g-3">
                        <!-- 카테고리 선택 드롭박스 -->
                        <div class="col-12 col-md-4">
                            <select name="terminal" class="form-select" required>
                                <option value="" disabled selected>터미널 선택</option>
                                <option value="BNCT">BNCT</option>
                                <option value="DGT">DGT</option>
                                <option value="HJNC">HJNC</option>
                                <option value="HPNT">HPNT</option>
                                <!-- <option value="PNC">PNC</option> -->  
                                <option value="PNIT">PNIT</option>
                            </select>
                        </div>
                        
                        <!-- 검색어 입력창 -->
                        <div class="col-12 col-md-6">
                            <input type="text" name="keyword" class="form-control" placeholder="(선박명 OR 뛰어쓰기[전체조회]) 입력" required>
                        </div>
                        
                        <!-- 검색 버튼 -->
                        <div class="col-12 col-md-2">
                            <button type="submit" class="btn btn-primary w-100 py-2">검색</button>
                        </div>
                    </div>
                </form>

                <!-- 검색 결과 카드 목록 영역 (모바일 상하 배치형) -->
                <div class="mt-4" th:if="${results != null}">
                    <h4 class="mb-3 fw-bold fs-5">검색 결과</h4>
                    
                    <!-- 결과가 없을 때 -->
                    <div th:if="${#lists.isEmpty(results)}" class="card border-0 shadow-sm rounded-4 p-4 text-center text-muted">
                        검색 결과가 없습니다.
                    </div>

                    <!-- 결과 목록을 카드 형태로 출력하여 모바일 가독성 극대화 -->
                    <div class="d-flex flex-column gap-3" th:unless="${#lists.isEmpty(results)}">
                        <div class="card border-0 shadow-sm rounded-4 p-3" th:each="info : ${results}">
                            <!-- 상단: 터미널 / 선명 -->
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge bg-secondary px-2 py-1" th:text="${info.terminal}">BNCT</span>
                                <span class="fw-bold fs-5 text-dark" th:text="${info.shipName}">-</span>
                            </div>
                            
                            <!-- 중단: TR 정보 -->
                            <div class="mb-3">
                                <span class="text-muted small d-block">TR 정보</span>
                                <span class="fw-bold text-primary fs-6" th:text="${info.trCode}">-</span>
                            </div>
                            
                            <!-- 하단: 입항 / 출항 시간 (배경을 깔아 구분감 부여) -->
                            <div class="bg-light p-2 rounded-3 row g-0 text-center small">
                                <div class="col-6 border-end">
                                    <span class="text-muted d-block" style="font-size: 0.8rem;">ETA (입항시각)</span>
                                    <span class="fw-semibold text-secondary" th:text="${info.eta}">-</span>
                                </div>
                                <div class="col-6">
                                    <span class="text-muted d-block" style="font-size: 0.8rem;">ETD (출항시각)</span>
                                    <span class="fw-semibold text-secondary" th:text="${info.etd}">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
